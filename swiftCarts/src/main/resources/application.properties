spring.application.name=swiftCarts
server.port=8081
server.address=0.0.0.0

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/swiftcart
spring.datasource.username=postgres
spring.datasource.password=2002

# JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Keycloak JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9080/realms/Swift

# swiftsAuth (Keycloak-fronting auth service) - used to provision the actual
# Keycloak login when a staff member registers, see SwiftsAuthClient
swiftsauth.base-url=http://localhost:8080

